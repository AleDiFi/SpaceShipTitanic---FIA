name: Python regression tests

on:
  push:
    branches:
      - main
      - refactor/single-pipeline-cleanup
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
      - name: Run feature ablation on audit branch
        if: github.head_ref == 'review/fia-conceptual-audit'
        env:
          MPLBACKEND: Agg
        run: python -m src.feature_ablation
        timeout-minutes: 25
      - name: Publish feature ablation CSVs
        if: github.head_ref == 'review/fia-conceptual-audit'
        uses: actions/upload-artifact@v4
        with:
          name: fia-feature-ablation
          path: |
            outputs/feature_ablation_folds.csv
            outputs/feature_ablation_summary.csv
